<!doctype html>

  <body>
    <!-- the torn-paper edge used by the text boxes (see style.css) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="paper-edge" x="-2%" y="-5%" width="104%" height="110%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.035"
          numOctaves="2"
          seed="4"
          result="noise"
        />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" />
      </filter>
    </svg>
    <canvas id="title-canvas" aria-hidden="true"></canvas>
    <main id="app">
      <header id="hud" hidden></header>
      <div id="subtitle" aria-live="polite"></div>
      <div id="pause-note" aria-live="polite">Paused. Press Space to continue.</div>
      <div id="idle-arrow" aria-hidden="true"></div>
      <div id="stage">
        <canvas
          id="screen"
          width="320"
          height="180"
          aria-label="The docks at dusk"
        ></canvas>
        <section id="panel" aria-live="polite"></section>
        <div id="coach" aria-live="polite" hidden></div>
      </div>
    </main>
    <div id="overlay" hidden></div>
  </body>
